name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python ignis.py --no-browser --output results/report.html --csv results/curves.csv --fusion-csv results/cases.csv --json results/scenario.json
      - run: python ignis.py --thermal-only --temperatures 1000 10000 --no-browser --output results/thermal.html
      - run: python ignis.py burn --no-browser --output results/burn.html --csv results/burn.csv --json results/burn.json
